name: "CodeQL Advanced"

on:
    workflow_dispatch:
    push:
        branches: [release, beta]
        paths:
            - ".github/workflows/codeql.yml"
            - ".github/codeql/**"
            - "**.h"
            - "**.hpp"
            - "**.c"
            - "**.cpp"
            - "**.mm"
    pull_request:
        branches: [beta]
        paths:
            - "**.h"
            - "**.hpp"
            - "**.c"
            - "**.cpp"
            - "**.mm"

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      # required for all workflows
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
          submodules: recursive

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual
        dependency-caching: true
        config-file: ./.github/codeql/codeql-config.yml

    - name: Install dependencies
      uses: ./.github/actions/setup-env
      with:
        os: ubuntu-24.04
        ccache: 'false'

    - name: Configure
      run: cmake -B build ${{ env.CMAKE_FLAGS }}
    
    - name: Build
      run: cmake --build build ${{ env.CMAKE_BUILD_FLAGS }}

    # paths-ignore in the config file is not honored for compiled languages
    # (build-mode: manual), so results in extern/ (vendored third-party code)
    # would still be reported. Analyze without uploading, drop the extern/
    # results from the SARIF, then upload the filtered files.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"
        upload: never
        output: sarif-results

    - name: Remove extern/ results from SARIF
      run: |
        mkdir -p sarif-filtered
        for f in sarif-results/*.sarif; do
          jq '.runs[].results |= map(select(all(.locations[]?.physicalLocation.artifactLocation.uri; (startswith("extern/") | not))))' \
            "$f" > "sarif-filtered/$(basename "$f")"
        done
        ls -l sarif-filtered

    - name: Upload filtered SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sarif-filtered
        category: "/language:c-cpp"
